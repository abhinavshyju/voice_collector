[project]
name = "voice-collector"
version = "1.0.0"
description = "Malayalam TTS voice dataset collection backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydub>=0.25",
    "transformers>=4.48",
    "torch>=2.5",
    "huggingface-hub>=0.27",
    "soundfile>=0.13",
    "numpy>=2.0",
    "python-multipart>=0.0.20",
    "audioop-lts>=0.2.2",
    "noisereduce>=3.0",
    "pyloudnorm>=0.1",
    "scipy>=1.14",
    "httpx>=0.28",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
